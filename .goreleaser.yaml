version: 2

project_name: mmmcp

builds:
  - id: mmmcp
    main: ./cmd/mmmcp
    binary: mmmcp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: mmmcp
    ids:
      - mmmcp
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: obot-platform
    name: mmmcp

dockers_v2:
  - id: mmmcp
    dockerfile: Dockerfile
    ids:
      - mmmcp
    images:
      - ghcr.io/obot-platform/mmmcp
    tags:
      - "{{ .Version }}"
      - "{{ if not .IsSnapshot }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    flags:
      - --target=runtime-release
      - --provenance=false
    sbom: false
